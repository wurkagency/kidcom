<script>
  // Tab Switch Micro-interaction
  const tabMoments = document.getElementById('tab-moments');
  const tabGallery = document.getElementById('tab-gallery');

  if (tabMoments && tabGallery) {
    tabMoments.addEventListener('click', () => {
      tabMoments.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-[0_2px_8px_rgba(22,26,24,0.06)]');
      tabMoments.classList.remove('text-on-surface-variant');
      tabGallery.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-[0_2px_8px_rgba(22,26,24,0.06)]');
      tabGallery.classList.add('text-on-surface-variant');
    });

    tabGallery.addEventListener('click', () => {
      tabGallery.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-[0_2px_8px_rgba(22,26,24,0.06)]');
      tabGallery.classList.remove('text-on-surface-variant');
      tabMoments.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-[0_2px_8px_rgba(22,26,24,0.06)]');
      tabMoments.classList.add('text-on-surface-variant');
    });
  }

  // Like Button Micro-interactions with tactile bounce
  document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const liked = btn.getAttribute('data-liked') === 'true';
      const countEl = btn.querySelector('.likes-counter');
      const iconEl = btn.querySelector('.heart-icon');
      let count = parseInt(btn.getAttribute('data-likes'), 10);

      if (!liked) {
        btn.setAttribute('data-liked', 'true');
        btn.setAttribute('data-likes', count + 1);
        countEl.textContent = count + 1;
        btn.classList.add('text-error');
        btn.classList.remove('text-on-surface-variant');
        iconEl.style.fontVariationSettings = "'FILL' 1";
        iconEl.classList.add('scale-125');
        setTimeout(() => iconEl.classList.remove('scale-125'), 200);
      } else {
        btn.setAttribute('data-liked', 'false');
        btn.setAttribute('data-likes', count - 1);
        countEl.textContent = count - 1;
        btn.classList.remove('text-error');
        btn.classList.add('text-on-surface-variant');
        iconEl.style.fontVariationSettings = "'FILL' 0";
      }
    });
  });

  // Bookmark Toggle
  document.querySelectorAll('.bookmark-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon.textContent === 'bookmark_border') {
        icon.textContent = 'bookmark';
        icon.style.fontVariationSettings = "'FILL' 1";
        btn.classList.add('text-on-surface');
      } else {
        icon.textContent = 'bookmark_border';
        icon.style.fontVariationSettings = "'FILL' 0";
        btn.classList.remove('text-on-surface');
      }
    });
  });

  // Sub-filter selection visual highlight
  document.querySelectorAll('.cat-filter').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-filter').forEach(b => {
        b.classList.remove('bg-secondary-container', 'text-on-secondary-fixed');
        b.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
      });
      btn.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
      btn.classList.add('bg-secondary-container', 'text-on-secondary-fixed');
    });
  });

  document.querySelectorAll('.child-filter').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.child-filter').forEach(b => {
        b.classList.remove('bg-primary', 'text-on-primary');
        b.classList.add('bg-surface-container-low', 'text-on-surface-variant');
      });
      btn.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
      btn.classList.add('bg-primary', 'text-on-primary');
    });
  });
</script></main>
