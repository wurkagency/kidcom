<script>
  (function() {
    const tabParent = document.getElementById('tab-parent');
    const tabCaregiver = document.getElementById('tab-caregiver');
    const roleHeadline = document.getElementById('role-headline');
    const roleDescription = document.getElementById('role-description');
    const childrenSection = document.getElementById('childrenSection');

    tabParent.addEventListener('click', () => {
      tabParent.className = "flex-1 py-2.5 px-3 rounded-full flex flex-col items-center justify-center transition-all bg-surface-container-lowest text-on-surface shadow-sm";
      tabCaregiver.className = "flex-1 py-2.5 px-3 rounded-full flex flex-col items-center justify-center transition-all text-secondary hover:text-on-surface";
      roleHeadline.textContent = "Primary Custody & Shared Access";
      roleDescription.textContent = "Sync schedules, messaging, and shared expenses peacefully.";
      childrenSection.style.display = 'flex';
    });

    tabCaregiver.addEventListener('click', () => {
      tabCaregiver.className = "flex-1 py-2.5 px-3 rounded-full flex flex-col items-center justify-center transition-all bg-surface-container-lowest text-on-surface shadow-sm";
      tabParent.className = "flex-1 py-2.5 px-3 rounded-full flex flex-col items-center justify-center transition-all text-secondary hover:text-on-surface";
      roleHeadline.textContent = "Support Circle & Pickups";
      roleDescription.textContent = "View approved event times, pickups, and kid emergency profiles.";
      childrenSection.style.display = 'none';
    });

    const childButtons = document.querySelectorAll('.child-btn');
    childButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        childButtons.forEach(b => {
          b.className = "child-btn py-2.5 px-3 rounded-full bg-surface-container-low text-secondary font-title-md text-title-md flex items-center justify-center gap-1.5 transition-all hover:bg-surface-container";
        });
        btn.className = "child-btn py-2.5 px-3 rounded-full bg-secondary-container text-on-secondary-fixed font-title-md text-title-md flex items-center justify-center gap-1.5 shadow-sm transition-all";
      });
    });

    const pwdInput = document.getElementById('password');
    const togglePwd = document.getElementById('togglePassword');
    const pwdIcon = document.getElementById('passwordIcon');
    const strengthText = document.getElementById('strengthText');
    const bar1 = document.getElementById('bar-1');
    const bar2 = document.getElementById('bar-2');
    const bar3 = document.getElementById('bar-3');
    const bar4 = document.getElementById('bar-4');

    togglePwd.addEventListener('click', () => {
      const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwdInput.setAttribute('type', type);
      pwdIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
    });

    pwdInput.addEventListener('input', (e) => {
      const val = e.target.value;
      const len = val.length;
      
      const bars = [bar1, bar2, bar3, bar4];
      bars.forEach(b => b.className = "h-full rounded-full bg-surface-container transition-colors");

      if (len === 0) {
        strengthText.textContent = "Enter password";
        strengthText.className = "font-label-sm text-label-sm text-on-surface-variant";
      } else if (len < 6) {
        bar1.className = "h-full rounded-full bg-error transition-colors";
        strengthText.textContent = "Too weak";
        strengthText.className = "font-label-sm text-label-sm text-error";
      } else if (len < 9) {
        bar1.className = "h-full rounded-full bg-secondary transition-colors";
        bar2.className = "h-full rounded-full bg-secondary transition-colors";
        strengthText.textContent = "Fair";
        strengthText.className = "font-label-sm text-label-sm text-secondary";
      } else if (len < 12) {
        bar1.className = "h-full rounded-full bg-secondary-fixed-dim transition-colors";
        bar2.className = "h-full rounded-full bg-secondary-fixed-dim transition-colors";
        bar3.className = "h-full rounded-full bg-secondary-fixed-dim transition-colors";
        strengthText.textContent = "Good";
        strengthText.className = "font-label-sm text-label-sm text-on-secondary-fixed-variant";
      } else {
        bars.forEach(b => b.className = "h-full rounded-full bg-secondary-container transition-colors");
        strengthText.textContent = "Strong & Secure";
        strengthText.className = "font-label-sm text-label-sm text-on-secondary-fixed";
      }
    });
  })();
</script></main>
