iv></div><h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight drop-shadow-xs" style="color: rgb(246, 248, 247);">Kinnd</h1><p class="font-body-md text-body-md text-secondary mt-1 max-w-[260px]" style="color: rgb(246, 248, 247);" data-stitch-orig-opacity="0.9">Family collaboration and sharing</p></div></div>
<!-- Main Card Container (shadcn Card primitive mapping) -->
<div class="w-full bg-transparent rounded-lg p-6 flex flex-col gap-5 mt-2">
<!-- Card Header / Context Badge -->
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">Log in</span>

</div>

</div>
<!-- Form Section -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault(); triggerSuccess();">
<!-- Email Field (shadcn Label + Input) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between pl-4" for="email">
<span class="">Email</span>

</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-xl pointer-events-none text-on-surface-variant">mail</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-full pl-11 pr-4 py-3 placeholder:text-outline outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-md border border-outline/20" id="email" placeholder="you@kinnd.eu" required="" type="email">
</div>
</div>
<!-- Password Field (shadcn Label + Input with toggle) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant pl-4" for="password">
          Password
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-xl pointer-events-none text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-full pl-11 pr-12 py-3 placeholder:text-outline outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-md border border-outline/20" id="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3.5 w-8 h-8 rounded-full flex items-center justify-center text-secondary hover:text-on-surface active:bg-surface-container transition-colors" id="toggle-pass" type="button">
<span class="material-symbols-outlined text-lg" id="pass-icon">visibility</span>
</button>
</div>
</div>
<!-- Controls Row: Remember me & Forgot Password -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none group">
<input checked="" class="w-4 h-4 rounded text-primary accent-primary cursor-pointer" id="remember-me" type="checkbox" placeholder="on" value="">
<span class="font-label-sm text-label-sm text-secondary group-hover:text-on-surface transition-colors" style="color: rgb(246, 248, 247);">Remember me</span>
</label>
<button class="font-label-sm text-label-sm text-on-surface font-semibold hover:underline underline-offset-4" type="button" style="color: rgb(246, 248, 247);">
          Forgot password?
        </button>
</div>
<!-- Primary Action: Sign In Button -->
<button class="w-full mt-2 h-12 bg-primary text-on-primary font-title-md text-title-md rounded-full flex items-center justify-center gap-2 shadow-sm active:scale-[0.99] transition-all hover:bg-surface-container-highest hover:text-on-surface" id="submit-btn" type="submit">
<span class="">Sign In</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- SSO / Social Separator -->
<div class="relative flex items-center justify-center my-1">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute bg-surface/60 backdrop-blur-md px-3 font-label-sm text-label-sm text-secondary rounded-full">
        or continue with
      </span>
</div>
<!-- Social Sign In Options -->
<div class="grid grid-cols-2 gap-3">
<!-- Apple Button -->
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all shadow-xs" type="button">
<svg class="w-4 h-4" viewBox="0 0 21 21">
<rect x="1" y="1" width="9" height="9" fill="#f25022"></rect>
<rect x="11" y="1" width="9" height="9" fill="#7fba00"></rect>
<rect x="1" y="11" width="9" height="9" fill="#00a4ef"></rect>
<rect x="11" y="11" width="9" height="9" fill="#ffb900"></rect>
</svg>
<span class="font-label-md text-label-md">Microsoft</span>
</button>
<!-- Google Button -->
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container-high active:scale-95 transition-all shadow-xs" type="button">
<svg class="w-4 h-4" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md">Google</span>
</button>
</div>
<!-- Switch to Sign Up -->
<div class="text-center pt-2">
<p class="font-body-md text-body-md text-secondary">
        New to Kinnd? 
        <button class="font-label-md text-label-md text-on-surface font-semibold underline underline-offset-4 hover:opacity-80" type="button">
          Create account
        </button>
</p>
</div>
</div>
<!-- Trust & Encryption Affirmation -->
<div class="mt-6 flex flex-col items-center justify-center gap-2 text-center">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-container/40 text-on-secondary-fixed">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-micro-meta text-micro-meta tracking-wider uppercase">Secured &amp; Encrypted</span>
</div>
<p class="font-label-sm text-label-sm text-secondary max-w-[280px]">
      All events, information and media remain private in the trusted family.
    </p>
</div>
</div>
<script>
  // Interaction: Password reveal toggle
  const toggleBtn = document.getElementById('toggle-pass');
  const passInput = document.getElementById('password');
  const passIcon = document.getElementById('pass-icon');

  if (toggleBtn && passInput && passIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passInput.type === 'password';
      passInput.type = isPassword ? 'text' : 'password';
      passIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Interactive Easter Egg: Soft bounce on emblem click
  const emblem = document.getElementById('kinnd-emblem');
  if (emblem) {
    emblem.addEventListener('click', () => {
      emblem.classList.add('scale-110');
      setTimeout(() => emblem.classList.remove('scale-110'), 250);
    });
  }

  // Visual submit micro-interaction feedback
  function triggerSuccess() {
    const btn = document.getElementById('submit-btn');
    if (!btn) return;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span><span>Entering...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-lg">check</span><span>Welcome</span>';
      btn.classList.add('bg-secondary-container', 'text-on-secondary-fixed');
    }, 900);
  }
</script></main>
